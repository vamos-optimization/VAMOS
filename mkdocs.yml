site_name: VAMOS
site_url: https://vamos-optimization.org/
site_description: "Multi-objective optimization in Python: compare algorithms, solve custom problems, and run reproducible studies with VAMOS."
repo_url: https://github.com/vamos-optimization/VAMOS
repo_name: vamos-optimization/VAMOS

exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/vamos-mark.svg
  favicon: assets/vamos-mark.svg
  font:
    text: DM Sans
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/vamos.css
  - stylesheets/home-hero.css

extra_javascript:
  - javascripts/api-reference.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy

