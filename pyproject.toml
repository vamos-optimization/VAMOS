[build-system]
requires = ["setuptools>=83", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "vamos-optimization"
dynamic = ["version"]
description = "Vectorized Architecture for Multiobjective Optimization Studies"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Nicolás R. Uribe" },
  { name = "Alberto Herrán" },
  { name = "Antonio J. Nebro" },
  { name = "Javier Del Ser" },
  { name = "J. Manuel Colmenar" },
]
maintainers = [
  { name = "Nicolás R. Uribe" },
]
keywords = [
  "multiobjective",
  "multi-objective",
  "optimization",
  "evolutionary algorithms",
  "moea",
  "pareto",
  "benchmarking",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "joblib>=1.3",
  "typing-extensions>=4.0.0",
]
readme = { file = "README.md", content-type = "text/markdown" }

[project.urls]
Homepage = "https://github.com/vamos-optimization/VAMOS"
Repository = "https://github.com/vamos-optimization/VAMOS"
Issues = "https://github.com/vamos-optimization/VAMOS/issues"
Documentation = "https://vamos-optimization.org/"

[project.optional-dependencies]
# Simplified core groups (preferred)
compute = [
  "numba>=0.57",
  "moocore>=0.2.0,<1.0",
  "dask[distributed]>=2026.1.0",
]
research = [
  "pymoo>=0.6",
  "jmetalpy>=1.5",
  "deap>=1.4",
  "platypus-opt>=1.0.4",
  "pygmo>=2.19",
]
analysis = [
  "pandas>=1.5",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "networkx>=3.0",
  "plotly>=5.18",
  "scikit-learn>=1.3",
  "ipython>=8.10",
  "ipykernel>=7.3",
  "ipywidgets>=8.1",
  "nbformat>=5.9",
  "nbconvert>=7.17.1",
]
# Model-based tuning backends (optional)
tuning = [
  "optuna>=3.6",
  "smac>=2.0",
  "ConfigSpace>=1.2",
  "hpbandster>=0.7.4",
]
# Studio UI (Panel-based)
studio = [
  "panel>=1.9.4",
  "param>=2.0",
  "bokeh>=3.8.2",
  "plotly>=5.18",
  "pandas>=1.5",
]
# Examples
examples = [
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]
# Documentation
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.7.7",
  "mkdocs-static-i18n>=1.2",
  "mkdocstrings[python]>=0.24",
  "jinja2>=3.1",
]
openai = [
  "openai>=1.0.0",
]
anthropic = [
  "anthropic>=0.30.0",
]
# Development and documentation
dev = [
  "tomli>=1.1.0; python_version < '3.11'",
  "pytest>=9.0.3",
  "pytest-cov>=4.1",
  "mypy>=1.9",
  "ruff>=0.6",
  "build>=1.2",
  "setuptools>=83",
  "wheel>=0.46.2",
  "mkdocs>=1.6",
  "mkdocs-material>=9.7.7",
  "mkdocs-static-i18n>=1.2",
  "mkdocstrings[python]>=0.24",
  "nbformat>=5.9",
  "nbconvert>=7.17.1",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]
all = [
  "numba>=0.57",
  "moocore>=0.2.0,<1.0",
  "dask[distributed]>=2026.1.0",
  "pymoo>=0.6",
  "jmetalpy>=1.5",
  "deap>=1.4",
  "platypus-opt>=1.0.4",
  "pygmo>=2.19",
  "pandas>=1.5",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "networkx>=3.0",
  "plotly>=5.18",
  "scikit-learn>=1.3",
  "ipython>=8.10",
  "ipykernel>=7.3",
  "ipywidgets>=8.1",
  "nbformat>=5.9",
  "nbconvert>=7.17.1",
  "optuna>=3.6",
  "smac>=2.0",
  "ConfigSpace>=1.2",
  "hpbandster>=0.7.4",
  "panel>=1.9.4",
  "param>=2.0",
  "bokeh>=3.8.2",
  "mkdocs>=1.6",
  "mkdocs-material>=9.7.7",
  "mkdocs-static-i18n>=1.2",
  "mkdocstrings[python]>=0.24",
  "jinja2>=3.1",
  "openai>=1.0.0",
  "anthropic>=0.30.0",
  "tomli>=1.1.0; python_version < '3.11'",
  "pytest>=9.0.3",
  "pytest-cov>=4.1",
  "mypy>=1.9",
  "ruff>=0.6",
  "build>=1.2",
  "setuptools>=83",
  "wheel>=0.46.2",
  "pyyaml>=6.0",
]

[project.scripts]
vamos = "vamos.experiment.cli.main:main"

[tool.mypy]
python_version = "3.12"
plugins = []
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = true
exclude = ["build/", "dist/"]
ignore_missing_imports = false
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
  "vamos.engine.algorithm.config",
  "vamos.engine.algorithm.config.*",
  "vamos.engine.config.spec",
  "vamos.experiment",
  "vamos.experiment.*",
  "vamos.foundation.kernel",
  "vamos.foundation.kernel.*",
  "vamos.foundation.problem",
  "vamos.foundation.problem.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
  "vamos.experiment.optimize",
  "vamos.experiment.optimization_result",
  "vamos.experiment.unified",
  "vamos.experiment.cli.*",
  "vamos.experiment.services.*",
  "vamos.ux.analysis.*",
  "vamos.ux.studio.*",
  "vamos.ux.results",
]
strict = true

[[tool.mypy.overrides]]
module = "vamos.ux.panel.*"
disallow_untyped_calls = false
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "vamos.engine.algorithm.registry"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "vamos.foundation.kernel.registry"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "moocore",
  "libhv",
  "pandas",
  "pandas.*",
  "dask",
  "dask.*",
  "matplotlib",
  "matplotlib.*",
  "numba",
  "optuna",
  "optuna.*",
  "ConfigSpace",
  "ConfigSpace.*",
  "smac",
  "smac.*",
  "plotly",
  "plotly.*",
  "pymoo.*",
  "jmetal.*",
  "jmetalpy.*",
  "hpbandster",
  "hpbandster.*",
  "pygmo.*",
  "sklearn",
  "sklearn.*",
  "panel",
  "panel.*",
  "param",
  "bokeh",
  "bokeh.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "smoke: fast critical tests",
  "slow: slow tests",
  "examples: notebook or example smoke tests",
  "notebooks: notebook-dependent tests",
  "backends: optional backend-dependent tests",
  "studio: Panel/UI dependent tests",
  "cli: command-line interface smoke tests",
  "numba: tests requiring the numba backend",
  "moocore: tests requiring the moocore backend",
  "e2e: integration gauntlet tests",
  "reference: scientific correctness verification tests",
]

[tool.setuptools.package-data]
"vamos" = ["py.typed"]
"vamos.resources" = ["reference_fronts/*.csv", "weights/*.csv", "weights/*.dat", "tsplib/*.tsp"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "vamos.foundation.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I", "B", "C4"]
ignore = [
    "E402",  # Module level import not at top - intentional for sys.path and matplotlib backend
    "E741",  # Ambiguous variable name 'l' - used in WFG problems (standard math notation)
    "E501",  # Line too long - handled by ruff format
    "B007",  # Loop control variable not used - intentional destructuring
    "B905",  # zip() without strict= - existing codebase pattern
    "C408",  # Unnecessary dict() call - dict() reads better in plotly marker kwargs
    "UP038",  # Tuple form keeps isinstance checks readable for mixed runtime types
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]  # Tests may assert broad exceptions intentionally

[tool.semantic_release]
version_variable = [
    "src/vamos/foundation/version.py:__version__",
]
branch = "main"
upload_to_pypi = true
upload_to_release = true
build_command = "pip install build && python -m build"
