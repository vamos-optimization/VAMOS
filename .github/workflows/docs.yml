name: Deploy versioned documentation

on:
  push:
    tags: ["v1.0.0"]
  workflow_dispatch:
    inputs:
      version:
        description: Version directory to deploy
        required: true
        default: "1.0.0"
      archive_run_id:
        description: Prior trusted documentation workflow run ID (required for every manual republish)
        required: true
      archive_artifact_name:
        description: Prior trusted portal artifact name (required for every manual republish)
        required: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'vamos-optimization/VAMOS'
    runs-on: ubuntu-latest
    env:
      DOC_VERSION: ${{ inputs.version || '1.0.0' }}
      DOC_BASE_URL: https://vamos-optimization.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install constrained documentation environment
        run: |
          python -m pip install --disable-pip-version-check -c constraints/ci.txt -e ".[docs]"
      - name: Require trusted archive input for manual republishes
        if: github.event_name == 'workflow_dispatch'
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          ARCHIVE_ARTIFACT_NAME: ${{ inputs.archive_artifact_name }}
        run: |
          test -n "$ARCHIVE_RUN_ID"
          test -n "$ARCHIVE_ARTIFACT_NAME"
      - name: Download previous trusted portal artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.archive_artifact_name }}
          path: previous-public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.archive_run_id }}
      - name: Build canonical and multilingual documentation strictly
        run: |
          test "$GITHUB_REPOSITORY" = "vamos-optimization/VAMOS"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || test "$GITHUB_REF_NAME" = "v$DOC_VERSION"
          args=(
            --version "$DOC_VERSION"
            --output public
            --base-url "$DOC_BASE_URL"
          )
          if test -d previous-public/docs; then
            args+=(--archive-from previous-public)
          fi
          python tools/build_release_docs.py "${args[@]}"
      - name: Verify release portal contract
        run: |
          python tools/check_docs_portal.py \
            --root public \
            --version "$DOC_VERSION" \
            --base-url "$DOC_BASE_URL"
      - name: Upload reusable portal archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vamos-docs-portal-${{ env.DOC_VERSION }}
          path: public/
          if-no-files-found: error
          retention-days: 90
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
