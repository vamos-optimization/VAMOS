name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

# A new push to a pull request cancels its previous run; other events never share a group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  typing:
    runs-on: ubuntu-latest
    env:
      VAMOS_TYPECHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up canonical typing Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install canonical typing environment
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt -e ".[dev]"
      - name: Strict typecheck
        run: python tools/typecheck.py --scope strict
      - name: Full development typecheck
        run: python tools/typecheck.py --scope full

  tests-full:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test Linux only, to save runners; the merge queue and main also test Windows and macOS.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
        include:
          # The only job with the tuning extra; without it, the Optuna, SMAC3 and BOHB backend tests are skipped.
          - os: ubuntu-latest
            python-version: "3.12"
            tuning: true
    env:
      # The research extra (pygmo) has Linux wheels only.
      EXTRAS: ${{ matrix.os == 'ubuntu-latest' && 'dev,compute,research,analysis,examples,studio,docs' || 'dev,compute,analysis,examples,studio,docs' }}${{ matrix.tuning && ',tuning' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (full extras)
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt -e ".[${EXTRAS}]"
      - name: Lint (ruff)
        run: ruff check src/vamos tests
      # Validation tier reference: /AGENTS.md. Keep this command identical to tools/health.py.
      - name: Agent documentation
        run: python tools/check_agent_docs.py
      - name: Architecture health checks
        run: |
          python -m pip install -c constraints/ci.txt -e ".[dev]"
          python tools/check_repository_hygiene.py
          python tools/check_repository_identity.py
          python tools/check_pre_release_remnants.py
          python -m pytest -q \
            tests/test_check_repository_hygiene.py \
            tests/test_check_repository_identity.py \
            tests/test_check_pre_release_remnants.py \
            tests/architecture/test_layer_boundaries.py \
            tests/test_monolith_guard.py \
            tests/test_public_api_guard.py \
            tests/architecture/test_public_api_snapshot.py \
            tests/test_import_time_smoke.py \
            tests/architecture/test_no_import_time_side_effects.py \
            tests/architecture/test_dependency_policy.py \
            tests/test_optional_deps_policy.py \
            tests/test_logging_policy.py \
            tests/test_no_prints_in_library.py \
            tests/test_no_deprecation_shims.py \
            tests/architecture/test_ruff_gate.py \
            tests/architecture/test_ruff_format_gate.py \
            tests/architecture/test_build_smoke.py \
            tests/architecture/test_py_typed_present.py
      - name: Confirmed regression checks
        run: |
          python -m pytest -q \
            tests/engine/test_permutation_edge_cases.py \
            tests/engine/test_moead_weight_vectors.py \
            tests/foundation/test_hypervolume_fallback.py \
            tests/engine/test_hyperheuristic_indicators.py \
            tests/engine/test_tuning_hypervolume_nd.py \
            tests/architecture/test_docs_and_workflows.py
      - name: Run tests
        run: pytest -m "not slow" --cov=src/vamos --cov-report=term-missing
      - name: Build docs
        run: mkdocs build --strict
      - name: Notebook Smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          VAMOS_RUN_NOTEBOOK_TESTS: "1"
        run: pytest -q tests/ux/test_notebooks.py

  tests-minimal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal package
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt . pytest
      - name: Run minimal smoke tests
        run: python -m pytest tests/integration/test_minimal_imports.py tests/foundation/test_packaging_data.py

  build-wheel:
    runs-on: ubuntu-latest
    needs: [typing, tests-full, tests-minimal]
    # A required check: it runs even when a needed job fails, and then fails itself, because
    # GitHub counts a skipped required check as passing, also in the merge queue.
    if: ${{ always() }}
    steps:
      - name: Require typing and tests
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "typing=${{ needs.typing.result }} tests-full=${{ needs.tests-full.result }} tests-minimal=${{ needs.tests-minimal.result }}"
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install -U pip build
          python -m pip install -c constraints/ci.txt -r constraints/ci.txt
          python -m build
      - name: Install wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.resources as res
          import vamos
          import vamos.api
          path = res.files("vamos.resources.reference_fronts") / "ZDT1.csv"
          assert path.is_file(), "Reference front missing in wheel"
          print("Wheel smoke OK:", vamos.__version__)
          PY
