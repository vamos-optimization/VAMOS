name: Documentation portal preview

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "examples/journeys/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "constraints/ci.txt"
      - "wrangler.jsonc"
      - "wrangler.preview.jsonc"
      - "cloudflare/**"
      - "tools/build_release_docs.py"
      - "tools/check_docs_portal.py"
      - "tools/check_docs_live.py"
      - ".github/workflows/docs-preview.yml"
      - ".github/workflows/docs-cloudflare-preview.yml"
      - ".github/workflows/docs-cloudflare-verify.yml"
      - ".github/workflows/docs-cloudflare.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOC_BASE_URL: https://vamos-optimization.org/

jobs:
  build:
    name: Build documentation preview artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install constrained documentation environment
        run: |
          python -m pip install --disable-pip-version-check -c constraints/ci.txt -e ".[docs]"
      - name: Resolve candidate documentation version
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import os

          version = metadata.version("vamos-optimization")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"DOC_VERSION={version}\n")
          PY
      - name: Build portable portal preview
        run: |
          python tools/build_release_docs.py \
            --version "$DOC_VERSION" \
            --output preview \
            --base-url "$DOC_BASE_URL"
      - name: Verify preview portal contract
        run: |
          python tools/check_docs_portal.py \
            --root preview \
            --version "$DOC_VERSION" \
            --base-url "$DOC_BASE_URL"
      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-preview-${{ github.event.pull_request.number || github.run_id }}
          path: preview/
          if-no-files-found: error
          retention-days: 14
      - name: Write trusted-preview handoff metadata
        if: github.event_name == 'pull_request'
        run: |
          mkdir preview-metadata
          printf '%s\n' '${{ github.event.pull_request.number }}' > preview-metadata/pr-number.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > preview-metadata/head-sha.txt
          printf '%s\n' '${{ github.event.pull_request.head.repo.full_name }}' > preview-metadata/head-repository.txt
      - name: Upload trusted-preview handoff metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-preview-meta-${{ github.event.pull_request.number }}
          path: preview-metadata/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize preview
        run: |
          {
            echo "### Documentation preview"
            echo
            echo "Built and verified VAMOS ${DOC_VERSION} against the canonical .org base."
            echo "The downloadable artifact is named \`docs-preview-${{ github.event.pull_request.number || github.run_id }}\`."
            echo "This workflow is read-only. A separate trusted workflow may publish the artifact to an isolated Cloudflare preview."
          } >> "$GITHUB_STEP_SUMMARY"
