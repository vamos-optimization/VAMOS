name: Zensical compatibility

on:
  pull_request:
    branches: [main, master]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "constraints/ci.txt"
      - "release/requirements-tools.txt"
      - ".github/workflows/docs-cloudflare.yml"
      - ".github/workflows/docs-cloudflare-preview.yml"
      - ".github/workflows/zensical-compat.yml"
  workflow_dispatch:

# A new push to a pull request cancels its previous run; manual runs never share a group.
concurrency:
  group: zensical-compat-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Zensical strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install existing documentation environment
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt -e ".[docs]"
      - name: Install Zensical compatibility stack
        run: |
          # Reuse the reviewed MkDocs/PyMdown pair from the canonical constraints.
          # Keep the Zensical renderer and its Python handler isolated to this probe.
          python -m pip install -c constraints/ci.txt \
            "mkdocstrings-python==2.0.8" \
            "zensical==0.0.59"
          python - <<'PY'
          import importlib.metadata as metadata

          for package in ("zensical", "mkdocstrings", "mkdocstrings-python"):
              print(package, metadata.version(package))
          PY
          python -m pip check
      - name: Build canonical documentation with Zensical
        run: zensical build --config-file mkdocs.yml --strict --clean
