name: Zensical compatibility

on:
  pull_request:
    branches: [main, master]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "constraints/ci.txt"
      - ".github/workflows/zensical-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Zensical strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install existing documentation environment
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt -e ".[docs]"
      - name: Install Zensical compatibility stack
        run: |
          # VAMOS 1.0.0 pins mkdocstrings 0.28.2 for the MkDocs release path.
          # Zensical's native mkdocstrings integration targets the v1 public API,
          # and the Python handler must use its corresponding v2 API. Keep this
          # upgrade isolated to the compatibility probe until migration is approved.
          python -m pip install \
            "mkdocstrings==1.0.6" \
            "mkdocstrings-python==2.0.8" \
            "zensical==0.0.59"
          python - <<'PY'
          import importlib.metadata as metadata

          for package in ("zensical", "mkdocstrings", "mkdocstrings-python"):
              print(package, metadata.version(package))
          PY
          python -m pip check
      - name: Build canonical documentation with Zensical
        run: zensical build --config-file mkdocs.yml --strict --clean
