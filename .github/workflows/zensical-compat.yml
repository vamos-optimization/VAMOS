name: Zensical compatibility

on:
  pull_request:
    branches: [main, master]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "constraints/ci.txt"
      - ".github/workflows/zensical-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Zensical strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install existing documentation environment
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt -e ".[docs]"
      - name: Install pinned Zensical probe
        run: |
          python -m pip install -c constraints/ci.txt zensical==0.0.59
          python -c "import importlib.metadata as m; print('Zensical', m.version('zensical'))"
      - name: Build canonical documentation with Zensical
        run: zensical build --config-file mkdocs.yml --strict --clean
