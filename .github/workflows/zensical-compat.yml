name: Zensical compatibility

on:
  pull_request:
    branches: [main, master]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "constraints/ci.txt"
      - ".github/workflows/zensical-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Zensical strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install existing documentation environment
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt -e ".[docs]"
      - name: Install Zensical compatibility stack
        run: |
          # VAMOS 1.0.0 pins mkdocstrings 0.28.2 for the MkDocs release path.
          # Zensical's native mkdocstrings integration targets the v1 public API,
          # so the probe upgrades only this isolated CI environment.
          python -m pip install "mkdocstrings[python]==1.0.6" zensical==0.0.59
          python - <<'PY'
          import importlib.metadata as metadata

          for package in ("zensical", "mkdocstrings", "mkdocstrings-python"):
              print(package, metadata.version(package))
          PY
          python -m pip check
      - name: Build canonical documentation with Zensical
        run: zensical build --config-file mkdocs.yml --strict --clean
