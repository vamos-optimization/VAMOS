name: Deploy documentation to Cloudflare

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable documentation version to publish
        required: true
      expected_source_sha:
        description: Full reviewed source commit SHA to publish
        required: true
      archive_release:
        description: Release tag vX.Y.Z whose vamos-docs-portal-X.Y.Z.tar.gz asset preserves the immutable releases (or give both run inputs)
        required: false
        default: ""
      archive_run_id:
        description: Prior trusted documentation workflow run ID, with archive_artifact_name (or give archive_release)
        required: false
        default: ""
      archive_artifact_name:
        description: Prior trusted portal artifact name, with archive_run_id (or give archive_release)
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-docs-production
  cancel-in-progress: false

env:
  DOC_BASE_URL: https://vamos-optimization.org/
  WRANGLER_VERSION: "4.129.1"

jobs:
  deploy:
    if: github.repository == 'vamos-optimization/VAMOS'
    name: Publish canonical documentation host
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://vamos-optimization.org/
    # Writing release assets needs contents: write; the workflow default stays read-only.
    permissions:
      actions: read
      contents: write
    env:
      DOC_VERSION: ${{ inputs.version }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check reviewed source commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install constrained documentation environment
        run: |
          python -m pip install --disable-pip-version-check -c constraints/ci.txt -e ".[docs]"
      - name: Check requested documentation version against source
        run: |
          python - <<'PYVERSION'
          import os
          from importlib.metadata import version
          requested = os.environ["DOC_VERSION"]
          installed = version("vamos-optimization")
          if requested != installed:
              raise SystemExit(f"Documentation version {requested} differs from source version {installed}")
          PYVERSION
      - name: Require the GitHub Release of the documented version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view "v$DOC_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          test "$tag" = "v$DOC_VERSION"
      - name: Select one trusted archive source
        id: archive
        env:
          ARCHIVE_RELEASE: ${{ inputs.archive_release }}
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          ARCHIVE_ARTIFACT_NAME: ${{ inputs.archive_artifact_name }}
        run: |
          if test -n "$ARCHIVE_RELEASE"; then
            if test -n "$ARCHIVE_RUN_ID" || test -n "$ARCHIVE_ARTIFACT_NAME"; then
              echo "Give archive_release or the two archive run inputs, not both." >&2
              exit 1
            fi
            if ! [[ "$ARCHIVE_RELEASE" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "archive_release must be a release tag such as v1.1.0." >&2
              exit 1
            fi
            {
              echo "source=release"
              echo "path=previous-release/vamos-docs-portal-${ARCHIVE_RELEASE#v}.tar.gz"
            } >> "$GITHUB_OUTPUT"
          elif test -n "$ARCHIVE_RUN_ID" && test -n "$ARCHIVE_ARTIFACT_NAME"; then
            {
              echo "source=artifact"
              echo "path=previous-public"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Give archive_release, or both archive_run_id and archive_artifact_name." >&2
            exit 1
          fi
      - name: Download previous trusted portal release asset
        if: steps.archive.outputs.source == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_RELEASE: ${{ inputs.archive_release }}
        run: |
          asset="vamos-docs-portal-${ARCHIVE_RELEASE#v}.tar.gz"
          mkdir previous-release
          gh release download "$ARCHIVE_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --dir previous-release \
            --pattern "$asset" \
            --pattern "$asset.sha256"
          cd previous-release
          test "$(wc -l < "$asset.sha256")" -eq 1
          read -r _ checked_name < "$asset.sha256"
          test "${checked_name#\*}" = "$asset"
          sha256sum --check --strict "$asset.sha256"
      - name: Download previous trusted portal artifact
        if: steps.archive.outputs.source == 'artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.archive_artifact_name }}
          path: previous-public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.archive_run_id }}
      - name: Build canonical Cloudflare portal
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        run: |
          test -e "$ARCHIVE_PATH"
          args=(
            --version "$DOC_VERSION"
            --output public
            --base-url "$DOC_BASE_URL"
            --archive-from "$ARCHIVE_PATH"
          )
          python tools/build_release_docs.py "${args[@]}"
      - name: Verify canonical Cloudflare portal
        run: |
          python tools/check_docs_portal.py \
            --root public \
            --version "$DOC_VERSION" \
            --base-url "$DOC_BASE_URL"
          python tools/check_docs_portal_active_content.py \
            --root public \
            --version "$DOC_VERSION" \
            --base-url "$DOC_BASE_URL"
      - name: Verify reader contract and record approved artifact
        run: |
          python tools/check_docs_site.py --root public --base-url "$DOC_BASE_URL"
          python tools/check_docs_artifact.py create --root public --manifest publication-evidence/artifact.json --source-sha "$GITHUB_SHA"
          python tools/check_docs_artifact.py verify --root public --manifest publication-evidence/artifact.json --source-sha "$GITHUB_SHA"
      - name: Upload publication identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vamos-docs-identity-${{ env.DOC_VERSION }}
          path: publication-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Upload canonical Cloudflare archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vamos-docs-cloudflare-${{ env.DOC_VERSION }}
          path: public/
          if-no-files-found: error
          retention-days: 90
      - name: Deploy Worker and custom domains
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config wrangler.jsonc
      - name: Verify live custom-domain contract
        run: |
          python tools/check_docs_live.py \
            --version "$DOC_VERSION" \
            --attempts 24 \
            --delay 10 \
            --timeout 15
      - name: Compare deployed current files with the approved artifact
        run: |
          python tools/check_docs_artifact.py live --root public --manifest publication-evidence/artifact.json --source-sha "$GITHUB_SHA" --base-url "$DOC_BASE_URL"
      - name: Package the published portal as a release asset
        id: package
        run: |
          set -o pipefail
          asset="vamos-docs-portal-${DOC_VERSION}.tar.gz"
          mkdir release-asset release-asset-check
          # Sorted names, owner 0 and the source commit time make the bytes depend only on the tree.
          tar --create --directory public --format=gnu --sort=name \
            --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' \
            --mtime="@$(git log -1 --format=%ct)" . \
            | gzip -n -9 > "release-asset/$asset"
          tar --extract --gzip --file "release-asset/$asset" --directory release-asset-check
          python tools/check_docs_artifact.py verify --root release-asset-check --manifest publication-evidence/artifact.json --source-sha "$GITHUB_SHA"
          cd release-asset
          sha256sum "$asset" > "$asset.sha256"
          echo "sha256=$(cut -d ' ' -f 1 "$asset.sha256")" >> "$GITHUB_OUTPUT"
      - name: Attach the portal archive to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="vamos-docs-portal-${DOC_VERSION}.tar.gz"
          gh release upload "v$DOC_VERSION" \
            "release-asset/$asset" "release-asset/$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Summarize production deployment
        env:
          ARCHIVE_SOURCE: ${{ steps.archive.outputs.source }}
          ARCHIVE_RELEASE: ${{ inputs.archive_release }}
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          ARCHIVE_ARTIFACT_NAME: ${{ inputs.archive_artifact_name }}
          PORTAL_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          if test "$ARCHIVE_SOURCE" = release; then
            carried="the portal asset of release $ARCHIVE_RELEASE"
          else
            carried="Actions artifact $ARCHIVE_ARTIFACT_NAME of run $ARCHIVE_RUN_ID"
          fi
          {
            echo "### VAMOS documentation production"
            echo
            echo "Published and live-verified VAMOS ${DOC_VERSION} through the \`vamos-docs\` Worker."
            echo "Primary: https://vamos-optimization.org/"
            echo "Aliases redirect to the primary host while preserving path and query."
            echo "Immutable docs/<version>/ trees were carried forward from ${carried}."
            echo "Durable archive: \`vamos-docs-portal-${DOC_VERSION}.tar.gz\` (SHA-256 \`${PORTAL_SHA256}\`), attached to release v${DOC_VERSION}."
          } >> "$GITHUB_STEP_SUMMARY"
