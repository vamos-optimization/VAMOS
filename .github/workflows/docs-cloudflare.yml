name: Deploy documentation to Cloudflare

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable documentation version to publish
        required: true
        default: "1.0.0"
      archive_run_id:
        description: Prior trusted documentation workflow run ID (required for versions after 1.0.0)
        required: false
      archive_artifact_name:
        description: Prior trusted portal artifact name (required for versions after 1.0.0)
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-docs-production
  cancel-in-progress: false

env:
  DOC_BASE_URL: https://vamos-optimization.org/
  WRANGLER_VERSION: "4.129.1"

jobs:
  deploy:
    if: github.repository == 'vamos-optimization/VAMOS'
    name: Publish canonical documentation host
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://vamos-optimization.org/
    env:
      DOC_VERSION: ${{ inputs.version }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install constrained documentation environment
        run: |
          python -m pip install --disable-pip-version-check -c constraints/ci.txt -e ".[docs]"
      - name: Require trusted archive input for later versions
        if: env.DOC_VERSION != '1.0.0'
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          ARCHIVE_ARTIFACT_NAME: ${{ inputs.archive_artifact_name }}
        run: |
          test -n "$ARCHIVE_RUN_ID"
          test -n "$ARCHIVE_ARTIFACT_NAME"
      - name: Download previous trusted portal artifact
        if: env.DOC_VERSION != '1.0.0'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.archive_artifact_name }}
          path: previous-public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.archive_run_id }}
      - name: Build canonical Cloudflare portal
        run: |
          args=(
            --version "$DOC_VERSION"
            --output public
            --base-url "$DOC_BASE_URL"
          )
          if test -d previous-public/docs; then
            args+=(--archive-from previous-public)
          fi
          python tools/build_release_docs.py "${args[@]}"
      - name: Verify canonical Cloudflare portal
        run: |
          python tools/check_docs_portal.py \
            --root public \
            --version "$DOC_VERSION" \
            --base-url "$DOC_BASE_URL"
      - name: Upload canonical Cloudflare archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vamos-docs-cloudflare-${{ env.DOC_VERSION }}
          path: public/
          if-no-files-found: error
          retention-days: 90
      - name: Deploy Worker and custom domains
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config wrangler.jsonc
      - name: Summarize production deployment
        run: |
          {
            echo "### VAMOS documentation production"
            echo
            echo "Published VAMOS ${DOC_VERSION} through the \`vamos-docs\` Worker."
            echo "Primary: https://vamos-optimization.org/"
            echo "Aliases redirect to the primary host while preserving path and query."
          } >> "$GITHUB_STEP_SUMMARY"
