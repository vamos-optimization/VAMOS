name: Regenerate SMPSO typing baseline

on:
  push:
    branches:
      - fix/smpso-result-contract
    paths:
      - .github/workflows/regen-smpso-typing-baseline.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/smpso-result-contract
          fetch-depth: 0
      - name: Set up canonical typing Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install canonical typing environment
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt -e ".[dev]"
      - name: Regenerate baseline
        run: python tools/typecheck.py --scope full --update-baseline --generation-commit "$GITHUB_SHA"
      - name: Commit regenerated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typing/mypy-baseline.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "type: refresh mypy baseline after SMPSO cleanup"
          git push origin HEAD:fix/smpso-result-contract
