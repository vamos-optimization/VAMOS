name: Performance Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
  schedule:
    - cron: "0 3 * * *"

# A new push to a pull request cancels its previous run; other events never share a group.
concurrency:
  group: performance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # pymoo is not a VAMOS dependency; tools/benchmark_compare_pymoo.py compares against it.
            pip install -c constraints/ci.txt -e ".[dev,compute]" pymoo
          else
            pip install -c constraints/ci.txt -e ".[dev,compute]"
          fi

      - name: Kernel benchmark smoke (timings informational)
        run: |
          python tools/benchmark_kernels.py --smoke --output artifacts/performance/kernel_smoke.json

      - name: Cross-framework smoke (scheduled only)
        if: github.event_name == 'schedule'
        run: |
          python tools/benchmark_compare_pymoo.py \
            --smoke \
            --cases zdt1 \
            --algorithms nsgaii moead \
            --seeds 42 \
            --engine numpy \
            --output artifacts/performance/pymoo_comparison_smoke.json \
            --markdown artifacts/performance/pymoo_comparison_smoke.md

      # Fails when the median hypervolume of VAMOS falls more than 5% below pymoo's for a case and an
      # algorithm, with the same seeds. Shared runners time too noisily to gate on, so runtimes stay informational.
      - name: Seeded cross-framework quality check (scheduled only)
        if: github.event_name == 'schedule'
        run: |
          python tools/benchmark_compare_pymoo.py \
            --cases zdt1 dtlz2 wfg1 \
            --algorithms nsgaii moead \
            --seeds 42 1337 2024 \
            --engine numba \
            --fail-below 5 \
            --output artifacts/performance/pymoo_comparison_nightly.json \
            --markdown artifacts/performance/pymoo_comparison_nightly.md

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kernel-benchmarks
          path: artifacts/performance/*
