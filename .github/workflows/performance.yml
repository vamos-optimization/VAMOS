name: Performance Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pip install -c constraints/ci.txt -e ".[dev,compute,research]"
          else
            pip install -c constraints/ci.txt -e ".[dev,compute]"
          fi

      - name: Benchmark smoke
        run: |
          python tools/benchmark_kernels.py --smoke --output artifacts/performance/kernel_smoke.json

      - name: Cross-framework smoke
        if: github.event_name == 'schedule'
        run: |
          python tools/benchmark_compare_pymoo.py \
            --smoke \
            --cases zdt1 \
            --algorithms nsgaii moead \
            --seeds 42 \
            --engine numpy \
            --output artifacts/performance/pymoo_comparison_smoke.json \
            --markdown artifacts/performance/pymoo_comparison_smoke.md

      - name: Compare against baseline (scheduled only)
        if: github.event_name == 'schedule'
        run: |
          if [ -f tests/performance/baselines/kernel_smoke_ubuntu_py310.json ]; then
            python tools/benchmark_kernels.py \
              --smoke \
              --output artifacts/performance/kernel_smoke_compare.json \
              --baseline tests/performance/baselines/kernel_smoke_ubuntu_py310.json
          else
            echo "No committed performance baseline found; skipping regression compare."
          fi

      - name: Seeded cross-framework report (scheduled only)
        if: github.event_name == 'schedule'
        run: |
          python tools/benchmark_compare_pymoo.py \
            --cases zdt1 dtlz2 wfg1 \
            --algorithms nsgaii moead \
            --seeds 42 1337 2024 \
            --engine numba \
            --output artifacts/performance/pymoo_comparison_nightly.json \
            --markdown artifacts/performance/pymoo_comparison_nightly.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kernel-benchmarks
          path: artifacts/performance/*
