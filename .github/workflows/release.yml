name: Release candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  VAMOS_RELEASE_VERSION: "1.0.0"
  VAMOS_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-distributions:
    if: >-
      github.repository == 'vamos-optimization/VAMOS' &&
      (github.event_name == 'workflow_dispatch' || github.head_ref == 'release/final-1.0.0' ||
      github.head_ref == 'chore/official-repository-cutover-1.0.0')
    name: Build frozen distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.VAMOS_RELEASE_COMMIT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install isolated build tools
        run: python -m pip install --disable-pip-version-check -r release/requirements-build.txt

      - name: Build wheel and sdist once
        run: python -m build --no-isolation --outdir candidate-dist

      - name: Upload candidate bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vamos-${{ env.VAMOS_RELEASE_VERSION }}-distributions
          path: candidate-dist/
          if-no-files-found: error
          retention-days: 90

  source-gates:
    name: Canonical release checker
    needs: build-distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.VAMOS_RELEASE_COMMIT }}

      - name: Set up canonical Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download frozen candidate bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vamos-${{ env.VAMOS_RELEASE_VERSION }}-distributions
          path: ${{ runner.temp }}/candidate-dist

      - name: Install source and release tooling
        run: |
          python -m pip install --disable-pip-version-check -c constraints/ci.txt -e ".[dev,docs,compute,analysis,examples,studio]"
          python -m pip install --disable-pip-version-check -r release/requirements-tools.txt

      - name: Create dependency-minimal canonical typing environment
        run: |
          python -m venv "$RUNNER_TEMP/typing-venv"
          "$RUNNER_TEMP/typing-venv/bin/python" -m pip install --disable-pip-version-check -r release/requirements-build.txt
          "$RUNNER_TEMP/typing-venv/bin/python" -m pip install --disable-pip-version-check --no-build-isolation -c constraints/ci.txt -e ".[dev]"

      - name: Run canonical checker
        env:
          VAMOS_EXPECTED_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          python tools/release_check.py
          --version "$VAMOS_RELEASE_VERSION"
          --expected-branch "$VAMOS_EXPECTED_BRANCH"
          --expected-commit "$VAMOS_RELEASE_COMMIT"
          --tag-state pre-tag
          --artifacts "$RUNNER_TEMP/candidate-dist"
          --typing-python "$RUNNER_TEMP/typing-venv/bin/python"
          --output-dir "$RUNNER_TEMP/release-evidence"

      - name: Upload complete release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vamos-${{ env.VAMOS_RELEASE_VERSION }}-evidence
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 90

  installed-wheel-matrix:
    name: Wheel ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.profile }}
    needs: build-distributions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            profile: minimum-minimal
            extras: ""
            smoke: core
          - os: ubuntu-latest
            python: "3.12"
            profile: primary-maximum-compute
            extras: compute
            smoke: full
          - os: windows-latest
            python: "3.12"
            profile: windows
            extras: ""
            smoke: core
          - os: macos-latest
            python: "3.12"
            profile: macos
            extras: ""
            smoke: core
    steps:
      - name: Checkout smoke and path-confinement tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.VAMOS_RELEASE_COMMIT }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Download exact candidate wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vamos-${{ env.VAMOS_RELEASE_VERSION }}-distributions
          path: candidate-dist

      - name: Install noneditable wheel
        shell: bash
        run: |
          WHEEL=$(find candidate-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL"
          SPEC="$WHEEL"
          if [ -n "${{ matrix.extras }}" ]; then SPEC="${WHEEL}[${{ matrix.extras }}]"; fi
          python -m pip install --disable-pip-version-check --no-cache-dir -c constraints/ci.txt "$SPEC" pytest
          python -m pip check

      - name: Public installed-wheel smoke
        shell: bash
        env:
          PYTHONPATH: ""
        run: python tools/release_smoke.py --version "$VAMOS_RELEASE_VERSION" --mode "${{ matrix.smoke }}"

      - name: Path-confinement and inert-loading tests
        shell: bash
        env:
          PYTHONPATH: ""
        run: >-
          python -m pytest -q
          tests/experiment/run_artifacts/test_integrity.py
          tests/experiment/study_manifest/test_security_models.py

      - name: Optional backend evidence
        if: matrix.extras == 'compute'
        shell: bash
        env:
          PYTHONPATH: ""
        run: >-
          python -m pytest -q
          tests/e2e/test_numba_engine.py
          tests/foundation/test_moocore_indicators.py

  freeze-evidence:
    name: Freeze validated evidence and artifacts
    needs: [source-gates, installed-wheel-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Download validated evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vamos-${{ env.VAMOS_RELEASE_VERSION }}-evidence
          path: frozen

      - name: Verify frozen hashes and source commit
        run: |
          cd frozen
          sha256sum --check SHA256SUMS
          test "$(jq -r .source_commit artifact-manifest.json)" = "$VAMOS_RELEASE_COMMIT"
          test "$(jq -r .repository artifact-manifest.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r .repository build-provenance.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r .status release-check-report.json)" = "passed"

      - name: Upload immutable publication input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vamos-${{ env.VAMOS_RELEASE_VERSION }}-frozen
          path: frozen/
          if-no-files-found: error
          retention-days: 90
