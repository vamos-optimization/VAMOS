# The real-coded tuning space of MOEA/D, with the subproblem update criterion.
# Written once from the Python builders of VAMOS 1.3.0; maintained as YAML since then.
schema: vamos.parameter-space
schema_version: 1.0.0
name: moead_constrained
algorithm: moead
encoding: real
description: The real-coded tuning space of MOEA/D, with the subproblem update criterion.
parameters:
  neighborhood_size: {type: int, default: 20, range: [5, 50], role: population}
  neighborhood_selection_probability: {type: real, default: 0.9, range: [0.0, 1.0], role: operator_rate}
  maximum_number_of_replaced_solutions: {type: int, default: 2, range: [1, 5], role: population}
  external_archive:
    type: categorical
    default: none
    role: adaptive
    values:
      none: {}
      unbounded: {}
      bounded:
        conditional_parameters:
          archive_prune_policy: {type: categorical, default: crowding, values: [crowding, hv, mc_hv, knn, maxmin, ref_dirs], role: adaptive}
  subproblem_order: {type: categorical, default: random_permutation, values: [random_permutation, cyclic], role: structural}
  aggregation_function:
    type: categorical
    default: pbi
    role: structural
    global_sub_parameters:
      normalize_objectives:
        type: categorical
        default: "false"
        role: structural
        values:
          "false": {}
          "true":
            conditional_parameters:
              normalization_epsilon: {type: real, default: 1.0e-6, range: [1.0e-8, 25.0], log: true, role: operator_rate}
    values:
      tchebycheff: {}
      weighted_sum: {}
      pbi:
        conditional_parameters:
          pbi_theta: {type: real, default: 5.0, range: [1.0, 200.0], log: true, role: operator_rate}
      modified_tchebycheff:
        conditional_parameters:
          mtch_rho: {type: real, default: 0.001, range: [0.0001, 0.1], role: operator_rate}
      augmented_tchebycheff:
        conditional_parameters:
          atch_rho: {type: real, default: 0.0001, range: [1.0e-6, 0.1], log: true, role: operator_rate}
      inverted_pbi:
        conditional_parameters:
          ipbi_theta: {type: real, default: 0.1, range: [0.01, 200.0], log: true, role: operator_rate}
      inverse_weight_tchebycheff: {}
  initial_solutions: {type: categorical, default: auto, values: [auto, random, lhs, scatter, sobol, halton, obl], role: structural}
  variation:
    type: categorical
    default: differential_evolution
    role: structural
    values:
      crossover_and_mutation:
        conditional_parameters:
          crossover:
            type: categorical
            default: sbx
            role: operator
            global_sub_parameters:
              crossover_probability: {type: real, default: 0.9, range: [0.6, 1.0], role: operator_rate}
            values:
              sbx:
                conditional_parameters:
                  sbx_distribution_index: {type: real, default: 20.0, range: [5.0, 400.0], role: operator_rate}
              blx_alpha:
                conditional_parameters:
                  crossover_alpha: {type: real, default: 0.5, range: [0.0, 1.0], role: operator_rate}
              blx_alpha_beta:
                conditional_parameters:
                  blxab_alpha: {type: real, default: 0.5, range: [0.0, 1.0], role: operator_rate}
                  blxab_beta: {type: real, default: 0.5, range: [0.0, 1.0], role: operator_rate}
              arithmetic: {}
              whole_arithmetic:
                conditional_parameters:
                  wa_alpha: {type: real, default: 0.5, range: [0.0, 1.0], role: operator_rate}
              laplace:
                conditional_parameters:
                  laplace_a: {type: real, default: 0.0, range: [-1.0, 1.0], role: operator_rate}
                  laplace_b: {type: real, default: 0.5, range: [0.01, 2.0], role: operator_rate}
              fuzzy:
                conditional_parameters:
                  fuzzy_d: {type: real, default: 0.5, range: [0.0, 2.0], role: operator_rate}
      differential_evolution:
        conditional_parameters:
          de_crossover_rate: {type: real, default: 1.0, range: [0.0, 1.0], role: operator_rate}
          de_scale_factor: {type: real, default: 0.5, range: [0.0, 1.0], role: operator_rate}
          de_scheme: {type: categorical, default: rand_1_bin, values: [rand_1_bin, rand_1_exp, rand_2_bin, rand_2_exp], role: operator}
          de_base: {type: categorical, default: current, values: [current, random], role: operator}
  mutation:
    type: categorical
    default: polynomial
    role: operator
    global_sub_parameters:
      mutation_probability_factor: {type: real, default: 1.0, range: [0.25, 3.0], role: operator_rate}
    values:
      polynomial:
        conditional_parameters:
          polynomial_mutation_distribution_index: {type: real, default: 20.0, range: [5.0, 400.0], role: operator_rate}
      linked_polynomial:
        conditional_parameters:
          linked_polynomial_mutation_distribution_index: {type: real, default: 20.0, range: [5.0, 400.0], role: operator_rate}
      gaussian:
        conditional_parameters:
          gaussian_sigma: {type: real, default: 0.1, range: [0.001, 0.5], role: operator_rate}
      non_uniform: {}
      cauchy:
        conditional_parameters:
          cauchy_gamma: {type: real, default: 0.1, range: [0.001, 0.5], role: operator_rate}
      uniform:
        conditional_parameters:
          uniform_perturb: {type: real, default: 0.1, range: [0.01, 0.5], role: operator_rate}
      levy_flight:
        conditional_parameters:
          levy_beta: {type: real, default: 1.5, range: [0.5, 2.0], role: operator_rate}
          levy_scale: {type: real, default: 0.01, range: [0.001, 0.1], role: operator_rate}
      power_law:
        conditional_parameters:
          power_index: {type: real, default: 1.0, range: [0.5, 5.0], role: operator_rate}
  repair: {type: categorical, default: auto, values: [auto, clip, reflect, random], role: structural}
  subproblem_update_criterion:
    type: categorical
    default: feasibility_rules
    role: structural
    values:
      feasibility_rules: {}
      improved_epsilon:
        conditional_parameters:
          improved_epsilon_tao: {type: real, default: 0.1, range: [0.01, 0.5], role: operator_rate}
          improved_epsilon_feasibility_ratio_threshold: {type: real, default: 0.95, range: [0.5, 1.0], role: operator_rate}
          improved_epsilon_decay_fraction: {type: real, default: 0.8, range: [0.1, 0.95], role: operator_rate}
      violation_threshold: {}
