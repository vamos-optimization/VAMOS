# The binary tuning space of AGE-MOEA.
# Written once from the Python builders of VAMOS 1.3.0; maintained as YAML since then.
schema: vamos.parameter-space
schema_version: 1.0.0
name: agemoea_binary
algorithm: agemoea
encoding: binary
description: The binary tuning space of AGE-MOEA.
parameters:
  external_archive:
    type: categorical
    default: none
    role: adaptive
    values:
      none: {}
      unbounded: {}
      bounded:
        conditional_parameters:
          archive_prune_policy: {type: categorical, default: crowding, values: [crowding, hv, mc_hv, knn, maxmin, ref_dirs], role: adaptive}
  crossover:
    type: categorical
    default: uniform
    role: operator
    global_sub_parameters:
      crossover_probability: {type: real, default: 0.9, range: [0.6, 1.0], role: operator_rate}
    values: [hux, uniform, one_point, two_point]
  mutation:
    type: categorical
    default: bitflip
    role: operator
    global_sub_parameters:
      mutation_probability_factor: {type: real, default: 1.0, range: [0.25, 3.0], role: operator_rate}
    values: [bitflip, segment_inversion]
  # The survival, as Evolver's replacement: AGE-MOEA's or AGE-MOEA-II's (Panichella, GECCO 2022).
  replacement: {type: categorical, default: agemoea, values: [agemoea, agemoea_ii], role: structural}
