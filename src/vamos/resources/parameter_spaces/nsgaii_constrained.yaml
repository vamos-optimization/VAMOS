# The real-coded tuning space of NSGA-II, with the constraint-handling technique.
# Written once from the Python builders of VAMOS 1.3.0; maintained as YAML since then.
schema: vamos.parameter-space
schema_version: 1.0.0
name: nsgaii_constrained
algorithm: nsgaii
encoding: real
description: The real-coded tuning space of NSGA-II, with the constraint-handling technique.
parameters:
  offspring_ratio: {type: categorical, default: 1.0, values: [0, 0.25, 0.5, 0.75, 1.0], role: population}
  selection:
    type: categorical
    default: tournament
    role: structural
    values:
      tournament:
        conditional_parameters:
          tournament_size: {type: int, default: 2, range: [2, 10], role: structural}
      random: {}
      boltzmann: {}
      ranking: {}
      sus: {}
  external_archive:
    type: categorical
    default: none
    role: adaptive
    values:
      none: {}
      unbounded: {}
      bounded:
        conditional_parameters:
          archive_prune_policy: {type: categorical, default: crowding, values: [crowding, hv, mc_hv, knn, maxmin, ref_dirs], role: adaptive}
  initial_solutions:
    type: categorical
    default: auto
    role: structural
    values:
      auto: {}
      random: {}
      lhs: {}
      scatter:
        conditional_parameters:
          scatter_base_size_factor: {type: categorical, default: 0.2, values: [0.1, 0.2, 0.3, 0.5, 0.75, 1.0], role: operator}
      sobol: {}
      halton: {}
      obl: {}
  crossover:
    type: categorical
    default: sbx
    role: operator
    global_sub_parameters:
      crossover_probability: {type: real, default: 0.9, range: [0.6, 1.0], role: operator_rate}
    values:
      sbx:
        conditional_parameters:
          sbx_distribution_index: {type: real, default: 20.0, range: [5.0, 40.0], role: operator_rate}
      blx_alpha:
        conditional_parameters:
          crossover_alpha: {type: real, default: 0.5, range: [0.0, 1.0], role: operator_rate}
      blx_alpha_beta:
        conditional_parameters:
          blxab_alpha: {type: real, default: 0.5, range: [0.0, 1.0], role: operator_rate}
          blxab_beta: {type: real, default: 0.5, range: [0.0, 1.0], role: operator_rate}
      arithmetic: {}
      whole_arithmetic:
        conditional_parameters:
          wa_alpha: {type: real, default: 0.5, range: [0.0, 1.0], role: operator_rate}
      laplace:
        conditional_parameters:
          laplace_a: {type: real, default: 0.0, range: [-1.0, 1.0], role: operator_rate}
          laplace_b: {type: real, default: 0.5, range: [0.01, 2.0], role: operator_rate}
      fuzzy:
        conditional_parameters:
          fuzzy_d: {type: real, default: 0.5, range: [0.0, 2.0], role: operator_rate}
      pcx:
        conditional_parameters:
          pcx_sigma_eta: {type: real, default: 0.1, range: [0.01, 0.5], role: operator_rate}
          pcx_sigma_zeta: {type: real, default: 0.1, range: [0.01, 0.5], role: operator_rate}
      undc:
        conditional_parameters:
          undx_zeta: {type: real, default: 0.5, range: [0.1, 1.0], role: operator_rate}
          undx_eta: {type: real, default: 0.35, range: [0.1, 1.0], role: operator_rate}
      simplex:
        conditional_parameters:
          simplex_epsilon: {type: real, default: 2.0, range: [1.0, 3.0], role: operator_rate}
  mutation:
    type: categorical
    default: polynomial
    role: operator
    global_sub_parameters:
      mutation_probability_factor: {type: real, default: 1.0, range: [0.25, 3.0], role: operator_rate}
    values:
      polynomial:
        conditional_parameters:
          polynomial_mutation_distribution_index: {type: real, default: 20.0, range: [5.0, 40.0], role: operator_rate}
      linked_polynomial:
        conditional_parameters:
          linked_polynomial_mutation_distribution_index: {type: real, default: 20.0, range: [5.0, 40.0], role: operator_rate}
      non_uniform: {}
      gaussian:
        conditional_parameters:
          gaussian_sigma: {type: real, default: 0.1, range: [0.001, 0.5], role: operator_rate}
      uniform_reset: {}
      cauchy:
        conditional_parameters:
          cauchy_gamma: {type: real, default: 0.1, range: [0.001, 0.5], role: operator_rate}
      uniform:
        conditional_parameters:
          uniform_perturb: {type: real, default: 0.1, range: [0.01, 0.5], role: operator_rate}
      levy_flight:
        conditional_parameters:
          levy_beta: {type: real, default: 1.5, range: [0.5, 2.0], role: operator_rate}
          levy_scale: {type: real, default: 0.01, range: [0.001, 0.1], role: operator_rate}
      power_law:
        conditional_parameters:
          power_index: {type: real, default: 1.0, range: [0.5, 5.0], role: operator_rate}
  repair: {type: categorical, default: auto, values: [auto, clip, reflect, random, wrap, midpoint], role: structural}
  constraint_handling:
    type: categorical
    default: cdp
    role: structural
    values:
      cdp: {}
      violated_constraints: {}
      epsilon_constrained:
        conditional_parameters:
          epsilon_initial_quantile: {type: real, default: 0.2, range: [0.05, 0.95], role: operator_rate}
          epsilon_exponent: {type: real, default: 5.0, range: [1.0, 10.0], role: operator_rate}
          epsilon_decay_fraction: {type: real, default: 0.8, range: [0.1, 0.95], role: operator_rate}
      push_pull:
        conditional_parameters:
          push_pull_change_threshold: {type: real, default: 0.001, range: [0.0001, 0.05], role: operator_rate}
          push_pull_window_fraction: {type: real, default: 0.02, range: [0.01, 0.1], role: operator_rate}
          push_pull_decay_fraction: {type: real, default: 0.8, range: [0.1, 0.95], role: operator_rate}
          push_pull_exponent: {type: real, default: 2.0, range: [1.0, 10.0], role: operator_rate}
          push_pull_feasibility_threshold: {type: real, default: 0.95, range: [0.5, 1.0], role: operator_rate}
          push_pull_reduction_rate: {type: real, default: 0.1, range: [0.01, 0.5], role: operator_rate}
      stochastic_ranking:
        conditional_parameters:
          stochastic_ranking_probability: {type: real, default: 0.45, range: [0.0, 0.5], role: operator_rate}
      self_adaptive_penalty: {}
      # Development after 1.5.2: three techniques that jMetal and Evolver do not have. The coefficients
      # multiply violations, so their ranges are wide and logarithmic.
      static_penalty:
        conditional_parameters:
          # pymoo's default penalty, 1e6, which makes a violation outweigh any difference of objectives.
          static_penalty_coefficient: {type: real, default: 1.0e+6, range: [1.0e-2, 1.0e+8], log: true, role: operator_rate}
      dynamic_penalty:
        conditional_parameters:
          # Joines and Houck's (C * k)^alpha * SVC(beta) (IEEE ICEC 1994, section 3.1): their P(2, 2), with C = 0.5.
          dynamic_penalty_constant: {type: real, default: 0.5, range: [0.01, 10.0], log: true, role: operator_rate}
          dynamic_penalty_alpha: {type: real, default: 2.0, range: [1.0, 3.0], role: operator_rate}
          dynamic_penalty_beta: {type: real, default: 2.0, range: [1.0, 3.0], role: operator_rate}
      violation_objective: {}
