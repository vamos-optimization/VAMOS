# The permutation tuning space of SMS-EMOA.
# Written once from the Python builders of VAMOS 1.3.0; maintained as YAML since then.
schema: vamos.parameter-space
schema_version: 1.0.0
name: smsemoa_permutation
algorithm: smsemoa
encoding: permutation
description: The permutation tuning space of SMS-EMOA.
parameters:
  selection:
    type: categorical
    default: random
    role: structural
    values:
      random: {}
      tournament:
        conditional_parameters:
          tournament_size: {type: int, default: 2, range: [2, 10], role: structural}
  reference_point_offset: {type: real, default: 1.0, range: [0.1, 2.0], role: operator_rate}
  external_archive:
    type: categorical
    default: none
    role: adaptive
    values:
      none: {}
      unbounded: {}
      bounded:
        conditional_parameters:
          archive_prune_policy: {type: categorical, default: crowding, values: [crowding, hv, mc_hv, knn, maxmin, ref_dirs], role: adaptive}
  crossover:
    type: categorical
    default: ox
    role: operator
    global_sub_parameters:
      crossover_probability: {type: real, default: 0.9, range: [0.6, 1.0], role: operator_rate}
    values: [ox, pmx, edge, cycle, position, aex]
  mutation:
    type: categorical
    default: swap
    role: operator
    global_sub_parameters:
      mutation_prob: {type: real, default: 0.1, range: [0.01, 0.5], role: operator_rate}
    values: [swap, insert, scramble, inversion, displacement, two_opt]
