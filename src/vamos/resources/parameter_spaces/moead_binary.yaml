# The binary tuning space of MOEA/D.
# Written once from the Python builders of VAMOS 1.3.0; maintained as YAML since then.
schema: vamos.parameter-space
schema_version: 1.0.0
name: moead_binary
algorithm: moead
encoding: binary
description: The binary tuning space of MOEA/D.
parameters:
  neighborhood_size: {type: int, default: 20, range: [5, 50], role: population}
  neighborhood_selection_probability: {type: real, default: 0.9, range: [0.0, 1.0], role: operator_rate}
  maximum_number_of_replaced_solutions: {type: int, default: 2, range: [1, 5], role: population}
  external_archive:
    type: categorical
    default: none
    role: adaptive
    values:
      none: {}
      unbounded: {}
      bounded:
        conditional_parameters:
          archive_prune_policy: {type: categorical, default: crowding, values: [crowding, hv, mc_hv, knn, maxmin, ref_dirs], role: adaptive}
  subproblem_order: {type: categorical, default: random_permutation, values: [random_permutation, cyclic], role: structural}
  aggregation_function:
    type: categorical
    default: pbi
    role: structural
    global_sub_parameters:
      normalize_objectives:
        type: categorical
        default: "false"
        role: structural
        values:
          "false": {}
          "true":
            conditional_parameters:
              normalization_epsilon: {type: real, default: 1.0e-6, range: [1.0e-8, 25.0], log: true, role: operator_rate}
    values:
      tchebycheff: {}
      weighted_sum: {}
      pbi:
        conditional_parameters:
          pbi_theta: {type: real, default: 5.0, range: [1.0, 200.0], log: true, role: operator_rate}
      modified_tchebycheff:
        conditional_parameters:
          mtch_rho: {type: real, default: 0.001, range: [0.0001, 0.1], role: operator_rate}
      augmented_tchebycheff:
        conditional_parameters:
          atch_rho: {type: real, default: 0.0001, range: [1.0e-6, 0.1], log: true, role: operator_rate}
      inverted_pbi:
        conditional_parameters:
          ipbi_theta: {type: real, default: 0.1, range: [0.01, 200.0], log: true, role: operator_rate}
      inverse_weight_tchebycheff: {}
  crossover:
    type: categorical
    default: uniform
    role: operator
    global_sub_parameters:
      crossover_probability: {type: real, default: 0.9, range: [0.6, 1.0], role: operator_rate}
    values: [hux, uniform, one_point, two_point]
  mutation:
    type: categorical
    default: bitflip
    role: operator
    global_sub_parameters:
      mutation_probability_factor: {type: real, default: 1.0, range: [0.25, 3.0], role: operator_rate}
    values: [bitflip, segment_inversion]
