# The real-coded tuning space of PPS, the push and pull search in MOEA/D.
# Development after 1.5.2. The defaults are the paper's (Fan et al., 2019, section 4.1).
schema: vamos.parameter-space
schema_version: 1.0.0
name: pps
algorithm: pps
encoding: real
description: The real-coded tuning space of PPS, the push and pull search in MOEA/D.
parameters:
  neighborhood_size: {type: int, default: 30, range: [5, 50], role: population}
  neighborhood_selection_probability: {type: real, default: 0.9, range: [0.0, 1.0], role: operator_rate}
  maximum_number_of_replaced_solutions: {type: int, default: 2, range: [1, 5], role: population}
  # The switch from the push stage to the pull stage: the largest relative change of the ideal and
  # nadir points over switch_window generations at most switch_threshold.
  switch_threshold: {type: real, default: 0.001, range: [0.0001, 0.05], log: true, role: adaptive}
  switch_window: {type: int, default: 20, range: [5, 100], role: adaptive}
  # The epsilon level of the pull stage. feasibility_ratio_threshold bounds the ratio of feasible to
  # infeasible solutions, so 2.0 means two thirds of the population feasible.
  feasibility_ratio_threshold: {type: real, default: 0.95, range: [0.1, 2.0], role: adaptive}
  tao: {type: real, default: 0.1, range: [0.01, 0.5], role: adaptive}
  cp: {type: real, default: 2.0, range: [1.0, 10.0], role: adaptive}
  decay_fraction: {type: real, default: 0.8, range: [0.5, 1.0], role: adaptive}
  initial_solutions:
    type: categorical
    default: auto
    role: structural
    values:
      auto: {}
      random: {}
      lhs: {}
      scatter:
        conditional_parameters:
          scatter_base_size_factor: {type: categorical, default: 0.2, values: [0.1, 0.2, 0.3, 0.5, 0.75, 1.0], role: structural}
  mutation:
    type: categorical
    default: polynomial
    role: operator
    global_sub_parameters:
      mutation_probability_factor: {type: real, default: 1.0, range: [0.25, 3.0], role: operator_rate}
    values:
      polynomial:
        conditional_parameters:
          polynomial_mutation_distribution_index: {type: real, default: 20.0, range: [5.0, 40.0], role: operator_rate}
      linked_polynomial:
        conditional_parameters:
          linked_polynomial_mutation_distribution_index: {type: real, default: 20.0, range: [5.0, 40.0], role: operator_rate}
      non_uniform: {}
      gaussian:
        conditional_parameters:
          gaussian_sigma: {type: real, default: 0.1, range: [0.001, 0.5], role: operator_rate}
      uniform_reset: {}
      cauchy:
        conditional_parameters:
          cauchy_gamma: {type: real, default: 0.1, range: [0.001, 0.5], role: operator_rate}
      uniform:
        conditional_parameters:
          uniform_perturb: {type: real, default: 0.1, range: [0.01, 0.5], role: operator_rate}
  repair: {type: categorical, default: auto, values: [auto, clip, reflect, random], role: structural}
  de_crossover_rate: {type: real, default: 1.0, range: [0.0, 1.0], role: operator_rate}
  de_scale_factor: {type: real, default: 0.5, range: [0.1, 1.0], role: operator_rate}
